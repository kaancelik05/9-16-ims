<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-deep p-4">
  <div class="pointer-events-none absolute inset-0 glow-top"></div>
  <div class="pointer-events-none absolute -top-32 left-1/2 h-64 w-[640px] -translate-x-1/2 rounded-full bg-primary/10 blur-[120px]"></div>

  <div class="relative w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center gap-3 text-center">
      <app-logo [width]="36" [height]="27" class="text-white" />
      <div>
        <h1 class="text-lg font-extrabold tracking-tight text-white">IMP</h1>
        <p class="mt-1 text-xs font-semibold uppercase tracking-[0.25em] text-slate-500">
          Influencer Management Platform
        </p>
      </div>
    </div>

    <form (submit)="submit($event)" class="glass glow-top space-y-4 rounded-xl p-6">
      <div>
        <label class="field-label" for="email">Work Email</label>
        <input
          id="email"
          name="email"
          type="email"
          class="field"
          placeholder="director@agency.com"
          autocomplete="email"
          [(ngModel)]="email"
          [disabled]="loading()"
        />
      </div>

      <div>
        <label class="field-label" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="field"
          placeholder="••••••••••••"
          autocomplete="current-password"
          [(ngModel)]="password"
          [disabled]="loading()"
        />
      </div>

      @if (error()) {
        <p
          class="flex items-center gap-2 rounded-lg border border-alert/30 bg-alert/10 px-3 py-2 text-xs font-semibold text-alert"
        >
          <app-icon name="alert" [size]="13" />
          {{ error() }}
        </p>
      }

      <button
        app-button
        variant="primary"
        size="lg"
        type="submit"
        class="w-full"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
        } @else {
          <app-icon name="lock" [size]="14" />
        }
        {{ loading() ? 'Authenticating…' : 'Sign In to Workspace' }}
      </button>
    </form>

    <p class="mt-6 text-center text-[10px] font-semibold uppercase tracking-widest text-slate-600">
      SOC2 Type II · GDPR / CCPA Ready · 256-bit Encryption
    </p>
  </div>
</div>
