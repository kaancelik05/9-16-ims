# Supabase project configuration for 9-16 IMP
project_id = "nine-sixteen-imp"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = ["http://localhost:4200/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ── Edge Functions ──────────────────────────────────────────────────
# Deploy secrets before invoking:
#   supabase secrets set ASANA_ACCESS_TOKEN=personal_access_token
# Verify JWTs so only agency staff can call asana-proxy; the webhook
# endpoint stays public (verify_jwt = false) because Asana calls it
# directly and authenticates via the X-Hook-Secret handshake.

[functions.asana-proxy]
enabled = true
verify_jwt = true

[functions.asana-webhook]
enabled = true
verify_jwt = false

[functions.consent-api]
enabled = true
verify_jwt = true
